# DFCN-YOLO for underwater fish detection with CBAM + FGFC on P3/P4/P5 backbone features.
# The default scale is n when no scale is inferred from the filename.

nc: 80
scales:
  # [depth, width, max_channels]
  n: [0.33, 0.25, 1024]
  s: [0.33, 0.50, 1024]
  m: [0.67, 0.75, 768]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.25, 512]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4 raw P3
  - [-1, 1, ResidualCBAM, []] # 5
  - [-1, 1, FGFC, []] # 6 enhanced P3
  - [4, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 6, C2f, [512, True]] # 8 raw P4
  - [-1, 1, ResidualCBAM, []] # 9
  - [-1, 1, FGFC, []] # 10 enhanced P4
  - [8, 1, Conv, [1024, 3, 2]] # 11-P5/32
  - [-1, 3, C2f, [1024, True]] # 12
  - [-1, 1, SPPF, [1024, 5]] # 13 raw P5
  - [-1, 1, ResidualCBAM, []] # 14
  - [-1, 1, FGFC, []] # 15 enhanced P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 10], 1, Concat, [1]] # cat enhanced P4
  - [-1, 3, C2f, [512]] # 18

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat enhanced P3
  - [-1, 3, C2f, [256]] # 21 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 18], 1, Concat, [1]] # cat head P4
  - [-1, 3, C2f, [512]] # 24 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 15], 1, Concat, [1]] # cat enhanced P5
  - [-1, 3, C2f, [1024]] # 27 (P5/32-large)

  - [[21, 24, 27], 1, Detect, [nc]] # Detect(P3, P4, P5)
